<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="tictactoe.js" defer></script>
    <title>TicTacToe Game</title>
</head>

<body>
    <h1 class="header">TicTacToe</h1>
    <div id="showName">
        <p>X's player: </p>
        <p>O's player: </p>
    </div>
    <div id="gameBoard">
        <svg>
            <line id="win1" x1="20px" y1="70px" x2="430px" y2="70px" stroke-width="12px" stroke-linecap="round" />
            <line id="win2" x1="20px" y1="220px" x2="430px" y2="220px" stroke-width="12px" stroke-linecap="round" />
            <line id="win3" x1="20px" y1="370px" x2="430px" y2="370px" stroke-width="12px" stroke-linecap="round" />

            <line id="win4" x1="75px" y1="20px" x2="75px" y2="430px" stroke-width="12px" stroke-linecap="round" />
            <line id="win5" x1="225px" y1="20px" x2="225px" y2="430px" stroke-width="12px" stroke-linecap="round" />
            <line id="win6" x1="375px" y1="20px" x2="375px" y2="430px" stroke-width="12px" stroke-linecap="round" />

            <line id="win7" x1="20px" y1="20px" x2="430px" y2="430px" stroke-width="12px" stroke-linecap="round" />
            <line id="win8" x1="430px" y1="20px" x2="20px" y2="430px" stroke-width="12px" stroke-linecap="round" />
        </svg>
    </div>

    <div class="bottom">
        <button id="newGame">- New Game -</button>
    </div>

    <!--input box-->
    <div id="customAlert">
        <div class="alertBox">
            <form id="form_playerName">
                <label for="inputX">Player X's Name :</label>
                <input type="text" id="inputX" name="inputX" required>
                <label for="inputO">Player O's Name :</label>
                <input type="text" id="inputO" name="inputO" required>

                <button type="submit" id="formSubmit">- submit -</button>
            </form>
        </div>
    </div>
</body>

</html>
